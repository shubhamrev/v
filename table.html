<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multiplication Study</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Georgia,"Times New Roman",serif;
    background:#0f1115;
    color:#e8e8e8;
}

header{
    height:72px;
    background:#181b21;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 28px;
    border-bottom:1px solid #2c313a;
    box-shadow:0 3px 15px rgba(0,0,0,.4);
}

.brand{
    font-size:25px;
    letter-spacing:.5px;
}

.nav{
    display:flex;
    gap:10px;
}

.nav button{
    border:1px solid #555d68;
    background:transparent;
    color:#ddd;
    padding:10px 20px;
    font:16px Georgia,serif;
    cursor:pointer;
    transition:.2s;
}

.nav button.active,
.nav button:hover{
    background:#303641;
    border-color:#777f8c;
}

main{
    max-width:1400px;
    margin:auto;
    padding:28px;
}

.page-title{
    text-align:center;
    margin:8px 0 24px;
}

.page-title h1{
    font-size:34px;
    font-weight:normal;
    margin:0 0 7px;
    color:#f2f2f2;
}

.page-title p{
    color:#9299a3;
    margin:0;
}

.hidden{
    display:none!important;
}

/* ================= TABLE ================= */

.table-wrap{
    overflow:auto;
    background:#171a20;
    border:1px solid #30353e;
    box-shadow:0 8px 25px rgba(0,0,0,.3);
}

table{
    border-collapse:collapse;
    width:100%;
    min-width:900px;
}

th,
td{
    border:1px solid #30353e;
    text-align:center;
    padding:10px 7px;
    font-size:15px;
}

thead th{
    background:#242932;
    color:#fff;
    font-weight:normal;
}

tbody th{
    background:#20242b;
    font-weight:bold;
}

tbody tr:nth-child(even) td{
    background:#14171c;
}

tbody tr:nth-child(odd) td{
    background:#181b21;
}

td{
    color:#d8dbe0;
}

td:hover{
    background:#303641!important;
}

/* ================= TEST ================= */

.test-layout{
    display:grid;
    grid-template-columns:minmax(0,1fr) 350px;
    gap:22px;
    align-items:start;
}

.test-card,
.log-card{
    background:#171a20;
    border:1px solid #30353e;
    box-shadow:0 8px 25px rgba(0,0,0,.3);
}

.test-card{
    padding:34px;
    min-height:600px;
}

.test-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #30353e;
    padding-bottom:18px;
    margin-bottom:30px;
}

.question-no{
    font-size:16px;
    color:#a5abb4;
}

.timer{
    font-family:monospace;
    font-size:20px;
    color:#d2d6dc;
}

.question-type{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:1.5px;
    color:#9da5b0;
    margin-bottom:18px;
}

.question{
    text-align:center;
    font-size:40px;
    line-height:1.4;
    margin:25px 0 35px;
    color:#f3f3f3;
}

/* ================= START TEST SCREEN ================= */

.start-screen{
    text-align:center;
    padding:20px 10px 35px;
}

.start-screen h2{
    font-size:28px;
    font-weight:normal;
    margin-bottom:10px;
}

.start-screen p{
    color:#9299a3;
    margin-bottom:28px;
}

.difficulty-box{
    display:flex;
    justify-content:center;
    gap:14px;
    flex-wrap:wrap;
    margin:25px auto 30px;
}

.difficulty-btn{
    min-width:120px;
    padding:14px 24px;
    background:#1c2027;
    border:1px solid #444b56;
    color:#cfd3d8;
    cursor:pointer;
    font:16px Georgia,serif;
    transition:.2s;
}

.difficulty-btn:hover{
    background:#2b3039;
}

.difficulty-btn.active{
    background:#3d4551;
    border-color:#7a8492;
    color:#fff;
}

.start-test-btn{
    padding:13px 35px;
    background:#303641;
    color:#fff;
    border:1px solid #59616d;
    cursor:pointer;
    font:17px Georgia,serif;
}

.start-test-btn:hover{
    background:#464e5b;
}

/* ================= INPUT ================= */

.answer-area{
    text-align:center;
}

.answer-input{
    width:280px;
    max-width:90%;
    padding:14px 16px;
    border:1px solid #4a515c;
    background:#101217;
    color:#fff;
    font:22px Georgia,serif;
    text-align:center;
    outline:none;
}

.answer-input:focus{
    border-color:#8c96a5;
    box-shadow:0 0 0 2px rgba(150,160,175,.12);
}

.submit-btn{
    display:block;
    margin:18px auto 0;
    padding:12px 28px;
    background:#303641;
    color:#fff;
    border:1px solid #4b535f;
    cursor:pointer;
    font:16px Georgia,serif;
    transition:.2s;
}

.submit-btn:hover{
    background:#444c59;
}

.submit-btn:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.feedback{
    min-height:30px;
    margin-top:18px;
    font-size:18px;
}

.correct{
    color:#70c98b;
}

.wrong{
    color:#ef7770;
}

.next-btn{
    margin:8px auto 0;
    padding:11px 25px;
    background:#3b424e;
    color:#fff;
    border:1px solid #59616d;
    cursor:pointer;
    font:16px Georgia,serif;
    display:none;
}

.next-btn:hover{
    background:#505965;
}

/* ================= LOG ================= */

.log-card{
    position:sticky;
    top:18px;
}

.log-head{
    padding:18px 20px;
    border-bottom:1px solid #30353e;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.log-head h2{
    font-size:20px;
    font-weight:normal;
    margin:0;
}

.score{
    font-size:14px;
    color:#a5abb4;
}

.log-list{
    max-height:590px;
    overflow:auto;
}

.log-item{
    display:grid;
    grid-template-columns:34px 1fr auto;
    gap:8px;
    align-items:center;
    padding:12px 15px;
    border-bottom:1px solid #282d35;
    font-size:13px;
}

.log-item .q{
    font-weight:bold;
}

.log-item .details{
    color:#9ca3ad;
    line-height:1.5;
}

.log-item .result{
    font-weight:bold;
}

.pending{
    color:#666d78;
}

.result.correct{
    color:#70c98b;
}

.result.wrong{
    color:#ef7770;
}

/* ================= CONTROLS ================= */

.test-controls{
    display:flex;
    gap:10px;
    margin-top:18px;
    flex-wrap:wrap;
}

.small-btn{
    padding:9px 15px;
    border:1px solid #454c57;
    background:#20242b;
    color:#ddd;
    font:14px Georgia,serif;
    cursor:pointer;
}

.small-btn:hover{
    background:#303641;
}

.stop-btn{
    border-color:#714d4d;
    color:#ef9a94;
}

.stop-btn:hover{
    background:#3a2727;
}

/* ================= FACTORS ================= */

.factor-info{
    text-align:center;
    color:#9ba2ac;
    margin-bottom:20px;
}

.factor-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(100px,1fr));
    gap:10px;
    max-width:700px;
    margin:0 auto 25px;
}

.factor-input{
    width:100%;
    padding:13px 8px;
    background:#101217;
    border:1px solid #454c57;
    color:#fff;
    text-align:center;
    font:18px Georgia,serif;
    outline:none;
}

.factor-input:focus{
    border-color:#7d8795;
}

.instructions{
    background:#20242b;
    border-left:3px solid #687281;
    padding:12px 15px;
    margin-bottom:22px;
    color:#b5bac2;
    font-size:14px;
}

/* ================= RESULTS ================= */

.result-panel{
    max-width:700px;
    margin:20px auto;
    background:#111419;
    border:1px solid #343a44;
    padding:25px;
}

.result-title{
    text-align:center;
    font-size:28px;
    margin-bottom:25px;
}

.result-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.result-box{
    background:#1c2027;
    border:1px solid #303640;
    padding:18px;
    text-align:center;
}

.result-box .value{
    font-size:26px;
    color:#f1f1f1;
    margin-top:6px;
}

.result-box .label{
    color:#9299a3;
    font-size:14px;
}

/* ================= RESPONSIVE ================= */

@media(max-width:850px){

    .test-layout{
        grid-template-columns:1fr;
    }

    .log-card{
        position:static;
    }

    .result-grid{
        grid-template-columns:1fr;
    }
}

@media(max-width:600px){

    header{
        padding:0 15px;
    }

    .brand{
        font-size:20px;
    }

    .nav button{
        padding:8px 12px;
        font-size:14px;
    }

    main{
        padding:15px;
    }

    .test-card{
        padding:20px;
    }

    .question{
        font-size:32px;
    }

    .difficulty-btn{
        min-width:100px;
    }
}
</style>
</head>

<body>

<header>

    <div class="brand">
        Multiplication Study
    </div>

    <div class="nav">

        <button
            id="tableBtn"
            class="active"
            onclick="showTable()">
            20 × 20 Table
        </button>

        <button
            id="testBtn"
            onclick="openTest()">
            Test
        </button>

    </div>

</header>


<main>

<!-- =========================================================
     TABLE PAGE
========================================================= -->

<section id="tablePage">

    <div class="page-title">

        <h1>Multiplication Table</h1>

        <p>Numbers from 1 to 20</p>

    </div>


    <div class="table-wrap">

        <table id="multiplicationTable"></table>

    </div>

</section>


<!-- =========================================================
     TEST PAGE
========================================================= -->

<section id="testPage" class="hidden">

    <div class="page-title">

        <h1>Multiplication Test</h1>

        <p>
            Select your difficulty and start the test
        </p>

    </div>


    <div class="test-layout">

        <!-- ================= TEST CARD ================= -->

        <div class="test-card">

            <div class="test-top">

                <div
                    class="question-no"
                    id="questionNo">
                    Test Setup
                </div>

                <div
                    class="timer"
                    id="timer">
                    00:00.0
                </div>

            </div>


            <div id="testContent"></div>


            <div class="test-controls">

                <button
                    class="small-btn"
                    onclick="showTable()">
                    ← View Table
                </button>

                <button
                    class="small-btn"
                    onclick="showStartScreen()">
                    ⚙ Test Setup
                </button>

                <button
                    class="small-btn stop-btn"
                    onclick="endTest()">
                    ■ Stop Test
                </button>

            </div>

        </div>


        <!-- ================= LOG ================= -->

        <aside class="log-card">

            <div class="log-head">

                <h2>Test Log</h2>

                <div
                    class="score"
                    id="score">
                    0 / 0
                </div>

            </div>


            <div
                class="log-list"
                id="logList">
            </div>

        </aside>

    </div>

</section>

</main>


<script>

/* =========================================================
   SETTINGS
========================================================= */

const MAX = 20;

let questionIndex = 0;

let questions = [];

let log = [];

let currentStart = 0;

let timerInterval = null;

let answered = false;

let selectedDifficulties = [];


/* =========================================================
   BUILD TABLE
========================================================= */

function buildTable(){

    const table =
        document.getElementById("multiplicationTable");

    let html =
        "<thead><tr><th>×</th>";

    for(let i=1;i<=MAX;i++){

        html += `<th>${i}</th>`;

    }

    html += "</tr></thead><tbody>";


    for(let r=1;r<=MAX;r++){

        html += `<tr><th>${r}</th>`;

        for(let c=1;c<=MAX;c++){

            html += `<td>${r*c}</td>`;

        }

        html += "</tr>";

    }

    html += "</tbody>";

    table.innerHTML = html;

}


/* =========================================================
   SHOW TABLE
========================================================= */

function showTable(){

    stopTimer();

    document
        .getElementById("tablePage")
        .classList.remove("hidden");

    document
        .getElementById("testPage")
        .classList.add("hidden");

    document
        .getElementById("tableBtn")
        .classList.add("active");

    document
        .getElementById("testBtn")
        .classList.remove("active");

}


/* =========================================================
   OPEN TEST
========================================================= */

function openTest(){

    document
        .getElementById("tablePage")
        .classList.add("hidden");

    document
        .getElementById("testPage")
        .classList.remove("hidden");

    document
        .getElementById("tableBtn")
        .classList.remove("active");

    document
        .getElementById("testBtn")
        .classList.add("active");

    showStartScreen();

}


/* =========================================================
   TEST SETUP SCREEN
========================================================= */

function showStartScreen(){

    stopTimer();

    questionIndex = 0;

    log = [];

    questions = [];


    document
        .getElementById("questionNo")
        .textContent = "Test Setup";

    document
        .getElementById("timer")
        .textContent = "00:00.0";


    document
        .getElementById("score")
        .textContent = "0 / 0";


    document
        .getElementById("logList")
        .innerHTML = "";


    document
        .getElementById("testContent")
        .innerHTML = `

        <div class="start-screen">

            <h2>
                Select Difficulty
            </h2>

            <p>
                You can select one, two, or all three.
            </p>


            <div class="difficulty-box">

                <button
                    class="difficulty-btn"
                    data-level="easy"
                    onclick="toggleDifficulty('easy')">
                    Easy
                </button>


                <button
                    class="difficulty-btn"
                    data-level="medium"
                    onclick="toggleDifficulty('medium')">
                    Medium
                </button>


                <button
                    class="difficulty-btn"
                    data-level="hard"
                    onclick="toggleDifficulty('hard')">
                    Hard
                </button>

            </div>


            <button
                class="start-test-btn"
                onclick="startTest()">

                Start Test

            </button>

        </div>

        `;


    selectedDifficulties = [];

}


/* =========================================================
   SELECT DIFFICULTY
========================================================= */

function toggleDifficulty(level){

    const index =
        selectedDifficulties.indexOf(level);


    if(index>=0){

        selectedDifficulties.splice(index,1);

    }else{

        selectedDifficulties.push(level);

    }


    document
        .querySelectorAll(".difficulty-btn")
        .forEach(button=>{

            const buttonLevel =
                button.dataset.level;

            button.classList.toggle(
                "active",
                selectedDifficulties.includes(buttonLevel)
            );

        });

}


/* =========================================================
   START TEST
========================================================= */

function startTest(){

    /*
       If the user presses Start Test without
       selecting a difficulty, do nothing.
    */

    if(selectedDifficulties.length===0){

        alert(
            "Please select at least one difficulty level."
        );

        return;

    }


    questionIndex = 0;

    log = [];

    questions = [];


    /*
       Generate 30 questions.

       The selected difficulty levels determine
       which types are used.
    */

    for(let i=0;i<30;i++){

        const level =
            selectedDifficulties[
                i % selectedDifficulties.length
            ];

        questions.push(
            makeQuestion(level)
        );

    }


    renderLog();

    showQuestion();

}


/* =========================================================
   RANDOM NUMBER
========================================================= */

function rand(min,max){

    return Math.floor(
        Math.random()*(max-min+1)
    )+min;

}


/* =========================================================
   MAKE QUESTION
========================================================= */

function makeQuestion(difficulty){

    /* ================= EASY ================= */

    if(difficulty==="easy"){

        const a = rand(1,9);

        const b = rand(1,9);

        return {

            difficulty:"Easy",

            type:"multiply",

            a:a,

            b:b,

            answer:a*b

        };

    }


    /* ================= MEDIUM ================= */

    if(difficulty==="medium"){

        const oneDigit = rand(1,9);

        const twoDigit = rand(10,20);


        if(Math.random()<0.5){

            return {

                difficulty:"Medium",

                type:"multiply",

                a:oneDigit,

                b:twoDigit,

                answer:oneDigit*twoDigit

            };

        }


        return {

            difficulty:"Medium",

            type:"multiply",

            a:twoDigit,

            b:oneDigit,

            answer:twoDigit*oneDigit

        };

    }


    /* ================= HARD ================= */

    if(difficulty==="hard"){

        const a = rand(10,20);

        const b = rand(10,20);

        return {

            difficulty:"Hard",

            type:"multiply",

            a:a,

            b:b,

            answer:a*b

        };

    }

}


/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(ms){

    const sec = ms/1000;


    if(sec<60){

        return sec.toFixed(1)+"s";

    }


    const m =
        Math.floor(sec/60);

    const s =
        Math.floor(sec%60);


    return String(m).padStart(2,"0")
        +":"
        +String(s).padStart(2,"0");

}


/* =========================================================
   START TIMER
========================================================= */

function startTimer(){

    currentStart =
        performance.now();


    stopTimer();


    timerInterval =
        setInterval(()=>{

            document
                .getElementById("timer")
                .textContent =
                formatTime(
                    performance.now()
                    -
                    currentStart
                );

        },100);

}


/* =========================================================
   STOP TIMER
========================================================= */

function stopTimer(){

    if(timerInterval){

        clearInterval(timerInterval);

        timerInterval=null;

    }

}


/* =========================================================
   SHOW QUESTION
========================================================= */

function showQuestion(){

    stopTimer();

    answered=false;


    const q =
        questions[questionIndex];


    document
        .getElementById("questionNo")
        .textContent =
        `Question ${questionIndex+1} of ${questions.length}`;


    document
        .getElementById("timer")
        .textContent =
        "00:00.0";


    let html = `

    <div class="question-type">

        ${q.difficulty} · Multiplication

    </div>


    <div class="question">

        ${q.a} × ${q.b} = ?

    </div>


    <div class="answer-area">

        <input
            id="answerInput"
            class="answer-input"
            type="number"
            autocomplete="off"
            placeholder="Your answer"
        >


        <button
            class="submit-btn"
            id="submitBtn"
            onclick="submitAnswer()">

            Check Answer

        </button>


        <div
            id="feedback"
            class="feedback">
        </div>


        <button
            id="nextBtn"
            class="next-btn"
            onclick="nextQuestion()">

            Next Question →

        </button>

    </div>

    `;


    document
        .getElementById("testContent")
        .innerHTML = html;


    const input =
        document.getElementById("answerInput");


    input.focus();


    /*
       IMPORTANT ENTER BEHAVIOR:

       First Enter:
       Check answer.

       Second Enter:
       Go to next question.
    */

    input.addEventListener(
        "keydown",
        function(e){

            if(e.key==="Enter"){

                e.preventDefault();


                if(!answered){

                    submitAnswer();

                }else{

                    nextQuestion();

                }

            }

        }
    );


    startTimer();

}


/* =========================================================
   SUBMIT ANSWER
========================================================= */

function submitAnswer(){

    if(answered){

        return;

    }


    const q =
        questions[questionIndex];


    const input =
        document.getElementById("answerInput");


    if(input.value.trim()===""){

        return;

    }


    const value =
        Number(input.value);


    const elapsed =
        performance.now()
        -
        currentStart;


    const ok =
        value===q.answer;


    finishQuestion(

        ok,

        elapsed,

        `Your answer: ${value}`

    );

}


/* =========================================================
   FINISH QUESTION
========================================================= */

function finishQuestion(
    ok,
    elapsed,
    detail
){

    answered=true;

    stopTimer();


    log.push({

        ok:ok,

        time:elapsed,

        detail:detail

    });


    const feedback =
        document.getElementById("feedback");


    feedback.className =
        "feedback "
        +
        (ok ? "correct" : "wrong");


    feedback.textContent =
        ok

        ? `✓ Correct — ${formatTime(elapsed)}`

        : `✗ Incorrect — ${formatTime(elapsed)}`;


    const input =
        document.getElementById("answerInput");


    if(input){

        input.disabled=true;

    }


    const submit =
        document.getElementById("submitBtn");


    if(submit){

        submit.disabled=true;

    }


    /*
       Show the next button as well.

       But the preferred method is:
       Press ENTER again.
    */

    const next =
        document.getElementById("nextBtn");


    if(next){

        next.style.display="block";

    }


    renderLog();

}


/* =========================================================
   NEXT QUESTION
========================================================= */

function nextQuestion(){

    if(!answered){

        return;

    }


    if(
        questionIndex
        <
        questions.length-1
    ){

        questionIndex++;

        showQuestion();

    }else{

        showTestResults();

    }

}


/* =========================================================
   STOP TEST
========================================================= */

function endTest(){

    stopTimer();


    if(log.length===0){

        showStartScreen();

        return;

    }


    showTestResults();

}


/* =========================================================
   TEST RESULTS
========================================================= */

function showTestResults(){

    stopTimer();


    const totalQuestions =
        questions.length;


    const attempted =
        log.length;


    const correct =
        log.filter(
            x=>x.ok
        ).length;


    const wrong =
        attempted-correct;


    const percentage =
        attempted===0
        ? 0
        :
        (
            (correct/attempted)
            *100
        ).toFixed(1);


    const totalTime =
        log.reduce(
            (sum,item)=>
                sum+item.time,
            0
        );


    const averageTime =
        attempted===0
        ? 0
        :
        totalTime/attempted;


    document
        .getElementById("questionNo")
        .textContent =
        "Test Analysis";


    document
        .getElementById("timer")
        .textContent =
        formatTime(totalTime);


    document
        .getElementById("testContent")
        .innerHTML = `

        <div class="question-type">

            Test Analysis

        </div>


        <div class="result-title">

            Test Complete

        </div>


        <div class="result-panel">

            <div class="result-grid">


                <div class="result-box">

                    <div class="label">
                        Total Questions
                    </div>

                    <div class="value">
                        ${totalQuestions}
                    </div>

                </div>


                <div class="result-box">

                    <div class="label">
                        Attempted
                    </div>

                    <div class="value">
                        ${attempted}
                    </div>

                </div>


                <div class="result-box">

                    <div class="label">
                        Correct
                    </div>

                    <div class="value">
                        ${correct}
                    </div>

                </div>


                <div class="result-box">

                    <div class="label">
                        Wrong
                    </div>

                    <div class="value">
                        ${wrong}
                    </div>

                </div>


                <div class="result-box">

                    <div class="label">
                        Correctness
                    </div>

                    <div class="value">
                        ${percentage}%
                    </div>

                </div>


                <div class="result-box">

                    <div class="label">
                        Total Time
                    </div>

                    <div class="value">
                        ${formatTime(totalTime)}
                    </div>

                </div>


                <div class="result-box">

                    <div class="label">
                        Average Time / Question
                    </div>

                    <div class="value">
                        ${formatTime(averageTime)}
                    </div>

                </div>


                <div class="result-box">

                    <div class="label">
                        Completion
                    </div>

                    <div class="value">
                        ${attempted}/${totalQuestions}
                    </div>

                </div>

            </div>

        </div>


        <div class="answer-area">

            <button
                class="submit-btn"
                onclick="showStartScreen()">

                New Test

            </button>

        </div>

        `;

}


/* =========================================================
   TEST LOG
========================================================= */

function renderLog(){

    const list =
        document.getElementById("logList");


    if(!questions.length){

        list.innerHTML="";

        return;

    }


    list.innerHTML =
        questions.map((q,i)=>{

            const item =
                log[i];


            return `

            <div class="log-item">

                <div class="q">

                    ${i+1}

                </div>


                <div class="details">

                    ${q.difficulty}

                    <br>

                    ${
                        item
                        ? item.detail
                        : "Waiting…"
                    }

                </div>


                <div
                    class="result ${
                        item
                        ?
                        (
                            item.ok
                            ?
                            "correct"
                            :
                            "wrong"
                        )
                        :
                        "pending"
                    }">

                    ${
                        item
                        ?
                        (
                            item.ok
                            ?
                            "✓"
                            :
                            "✗"
                        )
                        :
                        "—"
                    }

                    <br>

                    ${
                        item
                        ?
                        formatTime(item.time)
                        :
                        ""
                    }

                </div>

            </div>

            `;

        }).join("");


    document
        .getElementById("score")
        .textContent =
        `${log.filter(x=>x.ok).length} / ${log.length}`;

}


/* =========================================================
   INITIALIZE
========================================================= */

buildTable();

</script>
