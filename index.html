<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>India Map – Geography for Exam Prep</title>
<style>
:root {
  --bg: #ffffff;
  --ink: #1d2733;
  --muted: #6b7785;
  --region-fill: #e3eaf2;
  --region-hover: #a9c3de;
  --region-stroke: #7e8da0;
  --tip-bg: #1d2733;
  --tip-ink: #ffffff;
  --accent: #1f5f99;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--ink);
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

/* Header */
.top { position: relative; padding: 18px 16px 6px; text-align: center; }
.titles h1 { margin: 0; font-size: clamp(1.4rem, 2.6vw, 2rem); font-weight: 700; letter-spacing: 0.02em; }
.titles p { margin: 4px 0 0; font-size: 0.95rem; color: var(--muted); }
.back {
  position: absolute; left: 16px; top: 18px;
  padding: 7px 14px; font: inherit; font-size: 0.95rem;
  color: var(--accent); background: #fff;
  border: 1px solid #c5d3e2; border-radius: 6px; cursor: pointer;
}
.back:hover { background: #f0f5fa; }
.back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.back[hidden] { display: none; }

/* Map area */
#map-root { flex: 1; min-height: 0; padding: 8px 12px 16px; display: flex; align-items: center; justify-content: center; }
#map-root svg { width: 100%; height: 100%; display: block; }
.status { color: var(--muted); text-align: center; max-width: 560px; line-height: 1.5; }

.region {
  fill: var(--region-fill);
  stroke: var(--region-stroke);
  stroke-width: 0.8;
  vector-effect: non-scaling-stroke;
  stroke-linejoin: round;
}
.region:hover { fill: var(--region-hover); }
.level-india .region { cursor: pointer; }   /* only states are clickable */
.level-state .region { cursor: default; }

/* Tooltip */
.tooltip {
  position: fixed; left: 0; top: 0; z-index: 10;
  padding: 6px 11px; font-size: 0.95rem; font-weight: 600;
  color: var(--tip-ink); background: var(--tip-bg);
  border-radius: 6px; pointer-events: none; white-space: nowrap;
}
.tooltip[hidden] { display: none; }

@media (max-width: 560px) {
  .top { padding-top: 56px; }
  .back { top: 12px; left: 12px; }
}
</style>
</head>
<body>

<header class="top">
  <button id="back-btn" class="back" type="button" hidden>← India</button>
  <div class="titles">
    <h1 id="title">India Map</h1>
    <p id="subtitle">Interactive Map</p>
  </div>
</header>

<main id="map-root" aria-live="polite">
  <p class="status">Loading map…</p>
</main>

<div id="tooltip" class="tooltip" role="tooltip" hidden></div>

<script>
/* India Map – geography study tool (single file).
 * India level : hover = name, click = open that state.
 * State level : hover = district name, click = nothing.
 *
 * Boundary data (open, MIT licence) is loaded from:
 *   https://github.com/datta07/INDIAN-SHAPEFILES  (INDIA folder)
 * It is downloaded once, simplified, and cached in your browser (IndexedDB).
 */

const DATA_BASE = "https://raw.githubusercontent.com/datta07/INDIAN-SHAPEFILES/master/INDIA/";
const STATES_URL = DATA_BASE + "INDIA_STATES.geojson";
const DISTRICTS_URL = DATA_BASE + "INDIA_DISTRICTS.geojson";
const CACHE_VERSION = "v1";
const STATE_TOLERANCE = 0.004;      // degrees – smaller = more detail
const DISTRICT_TOLERANCE = 0.0015;

const root = document.getElementById("map-root");
const tooltip = document.getElementById("tooltip");
const backBtn = document.getElementById("back-btn");
const titleEl = document.getElementById("title");
const subtitleEl = document.getElementById("subtitle");

/* ================= Names ================= */

const CANONICAL = [
  "Andhra Pradesh", "Arunachal Pradesh", "Assam", "Bihar", "Chhattisgarh", "Goa",
  "Gujarat", "Haryana", "Himachal Pradesh", "Jharkhand", "Karnataka", "Kerala",
  "Madhya Pradesh", "Maharashtra", "Manipur", "Meghalaya", "Mizoram", "Nagaland",
  "Odisha", "Punjab", "Rajasthan", "Sikkim", "Tamil Nadu", "Telangana", "Tripura",
  "Uttar Pradesh", "Uttarakhand", "West Bengal",
  "Andaman and Nicobar Islands", "Chandigarh",
  "Dadra and Nagar Haveli and Daman and Diu", "Delhi", "Jammu and Kashmir",
  "Ladakh", "Lakshadweep", "Puducherry"
];
const DNHDD = "Dadra and Nagar Haveli and Daman and Diu";

const ALIASES = {
  orissa: "Odisha", uttaranchal: "Uttarakhand", telengana: "Telangana",
  nctofdelhi: "Delhi", pondicherry: "Puducherry",
  jammukashmir: "Jammu and Kashmir",
  andamanandnicobar: "Andaman and Nicobar Islands",
  andamannicobarislands: "Andaman and Nicobar Islands",
  dadraandnagarhaveli: DNHDD, dadaraandnagarhavelli: DNHDD, dadaraandnagarhaveli: DNHDD,
  damananddiu: DNHDD, daman: DNHDD, diu: DNHDD,
  dadraandnagarhavelianddamananddiu: DNHDD, dnhdd: DNHDD
};

const STATE_KEYS = ["STATE", "ST_NM", "STATE_NAME", "NAME_1", "state", "st_nm", "State", "stname", "STNAME", "STATE_UT"];
const STATE_NAME_KEYS = STATE_KEYS.concat(["NAME", "name", "Name"]);
const DISTRICT_KEYS = ["DISTRICT", "DT_NAME", "DIST_NAME", "NAME_2", "district", "dtname", "DTNAME", "District", "dist_name", "NAME"];

const normKey = s => String(s).toLowerCase().replace(/&/g, "and").replace(/[^a-z0-9]/g, "");
const CANON_BY_NORM = Object.fromEntries(CANONICAL.map(n => [normKey(n), n]));
const slugify = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

function canonicalState(raw) {
  const k = normKey(raw);
  return CANON_BY_NORM[k] || ALIASES[k] || null;
}

function pickKey(props, candidates) {
  for (const k of candidates) {
    if (props && props[k] !== undefined && props[k] !== null && props[k] !== "") return k;
  }
  return null;
}

function titleCase(s) {
  return String(s).trim().toLowerCase().replace(/(^|[\s(\-/])([a-z])/g, (m, a, b) => a + b.toUpperCase());
}

/* ================= Geometry helpers ================= */

function polygonsOf(geometry) {
  if (!geometry) return [];
  if (geometry.type === "Polygon") return [geometry.coordinates];
  if (geometry.type === "MultiPolygon") return geometry.coordinates;
  return [];
}

function perpDist(p, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1];
  if (dx === 0 && dy === 0) return Math.hypot(p[0] - a[0], p[1] - a[1]);
  const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / (dx * dx + dy * dy)));
  return Math.hypot(p[0] - (a[0] + t * dx), p[1] - (a[1] + t * dy));
}

// Iterative Douglas-Peucker
function simplifyRing(points, tol) {
  const n = points.length;
  if (n <= 4 || tol <= 0) return points;
  const keep = new Uint8Array(n);
  keep[0] = keep[n - 1] = 1;
  const stack = [[0, n - 1]];
  while (stack.length) {
    const [s, e] = stack.pop();
    let dmax = 0, idx = -1;
    for (let i = s + 1; i < e; i++) {
      const d = perpDist(points[i], points[s], points[e]);
      if (d > dmax) { dmax = d; idx = i; }
    }
    if (idx !== -1 && dmax > tol) {
      keep[idx] = 1;
      stack.push([s, idx], [idx, e]);
    }
  }
  const out = points.filter((_, i) => keep[i]);
  return out.length >= 4 ? out : points;
}

function cleanPolygons(geometry, tol) {
  const result = [];
  for (const poly of polygonsOf(geometry)) {
    const rings = [];
    for (let i = 0; i < poly.length; i++) {
      const pts = poly[i].map(c => [Math.round(c[0] * 1e4) / 1e4, Math.round(c[1] * 1e4) / 1e4]);
      const simple = simplifyRing(pts, tol);
      if (simple.length >= 4) rings.push(simple);
      else if (i === 0) break;           // outer ring too small -> drop polygon
    }
    if (rings.length) result.push(rings);
  }
  return result;
}

function toGeometry(polys) {
  return polys.length === 1
    ? { type: "Polygon", coordinates: polys[0] }
    : { type: "MultiPolygon", coordinates: polys };
}

/* ================= Data loading & processing ================= */

function showStatus(message) {
  root.className = "";
  root.innerHTML = "";
  const p = document.createElement("p");
  p.className = "status";
  p.textContent = message;
  root.appendChild(p);
}

function showError(err) {
  console.error(err);
  showStatus("Could not load the map. Check your internet connection and reload. (" + err.message + ")");
}

async function fetchJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Download failed: ${res.status} ${url}`);
  return res.json();
}

/* Small IndexedDB cache so large files are downloaded only once. Fails silently. */
function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open("india-map-gk", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("kv");
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function cacheGet(key) {
  try {
    const db = await openDB();
    return await new Promise(resolve => {
      const r = db.transaction("kv").objectStore("kv").get(CACHE_VERSION + ":" + key);
      r.onsuccess = () => resolve(r.result || null);
      r.onerror = () => resolve(null);
    });
  } catch (e) { return null; }
}
async function cacheSet(key, value) {
  try {
    const db = await openDB();
    await new Promise(resolve => {
      const tx = db.transaction("kv", "readwrite");
      tx.objectStore("kv").put(value, CACHE_VERSION + ":" + key);
      tx.oncomplete = tx.onerror = tx.onabort = () => resolve();
    });
  } catch (e) { /* ignore */ }
}

/* ---- India (states) ---- */
let indiaPromise = null;

function loadIndiaData() {
  if (!indiaPromise) {
    indiaPromise = (async () => {
      const cached = await cacheGet("india");
      if (cached) return cached;

      const fc = await fetchJSON(STATES_URL);
      const grouped = new Map();
      for (const f of fc.features) {
        const key = pickKey(f.properties, STATE_NAME_KEYS);
        if (!key) throw new Error("No state-name property found: " + Object.keys(f.properties || {}).join(", "));
        const name = canonicalState(f.properties[key]);
        if (!name) { console.warn("Unrecognised state in data:", f.properties[key]); continue; }
        if (!grouped.has(name)) grouped.set(name, []);
        grouped.get(name).push(...cleanPolygons(f.geometry, STATE_TOLERANCE));
      }
      const features = [];
      for (const name of CANONICAL) {
        const polys = grouped.get(name);
        if (!polys || !polys.length) { console.warn("No geometry for", name); continue; }
        features.push({
          type: "Feature",
          properties: { id: slugify(name), name },
          geometry: toGeometry(polys)
        });
      }
      const result = { type: "FeatureCollection", features };
      cacheSet("india", result);
      return result;
    })().catch(err => { indiaPromise = null; throw err; });
  }
  return indiaPromise;
}

/* ---- Districts (one big file, split by state, cached per state) ---- */
let districtsPromise = null;

function loadDistrictsFile() {
  if (!districtsPromise) {
    districtsPromise = fetchJSON(DISTRICTS_URL).then(fc => {
      const byState = new Map();
      for (const f of fc.features) {
        const props = f.properties || {};
        const sKey = pickKey(props, STATE_KEYS);
        const dKey = pickKey(props, DISTRICT_KEYS);
        if (!sKey || !dKey) throw new Error("No state/district property found: " + Object.keys(props).join(", "));
        const state = canonicalState(props[sKey]);
        if (!state) { console.warn("Unrecognised state for district:", props[sKey], props[dKey]); continue; }
        if (!byState.has(state)) byState.set(state, []);
        byState.get(state).push({ name: titleCase(props[dKey]), geometry: f.geometry });
      }
      return byState;
    }).catch(err => { districtsPromise = null; throw err; });
  }
  return districtsPromise;
}

async function loadStateData(stateName) {
  const key = "state:" + slugify(stateName);
  const cached = await cacheGet(key);
  if (cached) return cached;

  showStatus("Downloading district data (large file, first time only)…");
  const byState = await loadDistrictsFile();
  const items = byState.get(stateName);
  if (!items || !items.length) throw new Error("No districts found for " + stateName);

  const seen = {};
  const features = items
    .slice()
    .sort((a, b) => a.name.localeCompare(b.name))
    .map(it => {
      const polys = cleanPolygons(it.geometry, DISTRICT_TOLERANCE);
      const base = slugify(stateName) + "-" + slugify(it.name);
      seen[base] = (seen[base] || 0) + 1;
      return {
        type: "Feature",
        properties: { id: seen[base] === 1 ? base : base + "-" + seen[base], name: it.name },
        geometry: toGeometry(polys)
      };
    })
    .filter(f => polygonsOf(f.geometry).length);

  const result = { type: "FeatureCollection", features };
  cacheSet(key, result);
  return result;
}

/* ================= Projection & drawing ================= */

// Web-Mercator style projection.
function project(lon, lat) {
  const rad = Math.PI / 180;
  const clamped = Math.max(-85, Math.min(85, lat));
  return [lon * rad, -Math.log(Math.tan(Math.PI / 4 + (clamped * rad) / 2))];
}

function computeBounds(features) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const f of features) {
    for (const poly of polygonsOf(f.geometry)) {
      for (const [lon, lat] of poly[0]) {
        const [x, y] = project(lon, lat);
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  return { minX, minY, maxX, maxY };
}

function buildPathData(geometry, tx) {
  const parts = [];
  for (const poly of polygonsOf(geometry)) {
    for (const ring of poly) {
      let d = "", lastX = null, lastY = null;
      for (let i = 0; i < ring.length; i++) {
        const [x, y] = tx(ring[i][0], ring[i][1]);
        if (lastX !== null && Math.abs(x - lastX) < 0.15 && Math.abs(y - lastY) < 0.15) continue;
        d += (d ? "L" : "M") + x.toFixed(2) + " " + y.toFixed(2);
        lastX = x; lastY = y;
      }
      if (d) parts.push(d + "Z");
    }
  }
  return parts.join("");
}

function renderMap(geojson, level) {
  const features = geojson.features.filter(f => polygonsOf(f.geometry).length);
  const b = computeBounds(features);
  const scale = 1000 / (b.maxX - b.minX);
  const tx = (lon, lat) => {
    const [x, y] = project(lon, lat);
    return [(x - b.minX) * scale, (y - b.minY) * scale];
  };
  const width = (b.maxX - b.minX) * scale;
  const height = (b.maxY - b.minY) * scale;
  const pad = 15;

  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", `${-pad} ${-pad} ${width + pad * 2} ${height + pad * 2}`);
  svg.setAttribute("preserveAspectRatio", "xMidYMid meet");
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", level === "india" ? "Map of India" : "District map");

  for (const f of features) {
    const path = document.createElementNS(NS, "path");
    path.setAttribute("d", buildPathData(f.geometry, tx));
    path.setAttribute("class", "region");
    path.setAttribute("fill-rule", "evenodd");
    path.dataset.id = f.properties.id;
    path.dataset.name = f.properties.name;
    svg.appendChild(path);
  }

  root.className = "level-" + level;
  root.innerHTML = "";
  root.appendChild(svg);
  return svg;
}

/* ================= Tooltip ================= */

function showTooltip(text, clientX, clientY) {
  tooltip.textContent = text;
  tooltip.hidden = false;
  const margin = 14;
  const w = tooltip.offsetWidth, h = tooltip.offsetHeight;
  let x = clientX + margin, y = clientY + margin;
  if (x + w > window.innerWidth - 4) x = clientX - w - margin;
  if (y + h > window.innerHeight - 4) y = clientY - h - margin;
  tooltip.style.transform = `translate(${Math.max(4, x)}px, ${Math.max(4, y)}px)`;
}

function hideTooltip() {
  tooltip.hidden = true;
}

/* ================= Interaction (event delegation) ================= */

function regionFromEvent(e) {
  return e.target instanceof Element ? e.target.closest("path.region") : null;
}

// Hover/touch -> name. Used on both the India map and the state maps.
function setupStateHover(svg) {
  svg.addEventListener("pointerover", e => {
    const r = regionFromEvent(e);
    if (r) showTooltip(r.dataset.name, e.clientX, e.clientY);
  });
  svg.addEventListener("pointermove", e => {
    const r = regionFromEvent(e);
    if (r) showTooltip(r.dataset.name, e.clientX, e.clientY);
    else hideTooltip();
  });
  svg.addEventListener("pointerleave", hideTooltip);
  svg.addEventListener("pointerdown", e => {
    const r = regionFromEvent(e);
    if (r) showTooltip(r.dataset.name, e.clientX, e.clientY);
  });
}

// Only called for the India map. District maps never get a click handler.
function setupStateClick(svg) {
  svg.addEventListener("click", e => {
    const r = regionFromEvent(e);
    if (r) loadStateMap({ id: r.dataset.id, name: r.dataset.name });
  });
}

/* ================= Screens ================= */

async function loadIndiaMap() {
  hideTooltip();
  backBtn.hidden = true;
  titleEl.textContent = "India Map";
  subtitleEl.textContent = "Interactive Map";
  try {
    showStatus("Loading map…");
    const data = await loadIndiaData();
    const svg = renderMap(data, "india");
    setupStateHover(svg);
    setupStateClick(svg);
  } catch (err) {
    showError(err);
  }
}

async function loadStateMap(state) {
  hideTooltip();
  backBtn.hidden = false;
  titleEl.textContent = state.name;
  subtitleEl.textContent = "Districts";
  try {
    showStatus("Loading map…");
    const data = await loadStateData(state.name);
    const svg = renderMap(data, "state");
    setupStateHover(svg);            // hover only – no click handler
  } catch (err) {
    showError(err);
  }
}

function resetToIndia() {
  loadIndiaMap();
}

backBtn.addEventListener("click", resetToIndia);
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !backBtn.hidden) resetToIndia();
});

loadIndiaMap();
</script>
</body>
</html>
