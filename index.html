  margin: 0;

  display: flex;
  flex-direction: column;

/* =========================================================
   HEADER
========================================================= */

.top {
  position: relative;
  padding: 18px 16px 6px;
  text-align: center;
}

  letter-spacing: 0.02em;

  border-radius: 6px;

  cursor: pointer;
}

}

.back:focus-visible {

/* World button */

   MAP AREA
========================================================= */

  align-items: center;
  justify-content: center;
}

  height: 100%;
  display: block;
}

  color: var(--muted);
  text-align: center;

  max-width: 650px;

  line-height: 1.5;
}

   MAP REGIONS
========================================================= */

.region {
  fill: var(--region-fill);

  stroke: var(--region-stroke);
  stroke-width: 0.8;

  vector-effect: non-scaling-stroke;

  stroke-linejoin: round;

  transition:
    fill 0.08s ease;
}

.region:hover {
  fill: var(--region-hover);
}

/* India map states are clickable */
.level-india .region {
  cursor: pointer;
}

/* World countries are clickable */
.level-world .region {
  cursor: pointer;
}

/* State districts are NOT clickable */
.level-state .region {
  cursor: default;
}

/* Country ADM1 divisions are NOT clickable */
.level-country .region {
  cursor: default;
}

   TOOLTIP
========================================================= */

.tooltip {
  position: fixed;

  left: 0;
  top: 0;

  z-index: 100;

  font-size: 0.95rem;
  font-weight: 600;

  color: var(--tip-ink);
  background: var(--tip-bg);

  border-radius: 6px;

  pointer-events: none;

  white-space: nowrap;
}

========================================================= */

   INDIA + WORLD GEOGRAPHY MAP
=========================================================

   Navigation:

   INDIA
      ↓ click state
   STATE

   WORLD
      ↓ click country
   COUNTRY
      ↓ hover state/province/region
   ADM1

   Important:
   - India states are clickable.
   - India districts are NOT clickable.
   - World countries are clickable.
   - Country ADM1 divisions are NOT clickable.
========================================================= */


/* =========================================================
   DOM ELEMENTS
========================================================= */

const tooltip =

const backBtn =

/* =========================================================
   DATA SOURCES
========================================================= */


/* -------------------------
   INDIA
------------------------- */

const INDIA_BASES = [

  "https://raw.githubusercontent.com/datta07/INDIAN-SHAPEFILES/master/INDIA/",

  "https://cdn.jsdelivr.net/gh/datta07/INDIAN-SHAPEFILES@master/INDIA/"

];

const STATE_BASES = [

  "https://raw.githubusercontent.com/datta07/INDIAN-SHAPEFILES/master/STATES/",

  "https://cdn.jsdelivr.net/gh/datta07/INDIAN-SHAPEFILES@master/STATES/"

];

const INDIA_FILE =
  "INDIA_STATES.geojson";


/* -------------------------
   WORLD COUNTRIES
------------------------- */

/*
   Natural Earth country polygons.

   This is the country layer used
   for the World Map.
*/

const WORLD_COUNTRIES_URL =
  "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson";


/* -------------------------
   COUNTRY ADM1
------------------------- */

/*
   geoBoundaries API

   ADM1 =
   first administrative level.

   Examples:

   USA -> States
   India -> States
   Canada -> Provinces

*/

const GEOboundariesAPI =

/* =========================================================

const STATE_FOLDER = {

/* =========================================================

========================================================= */

const CANONICAL_STATES = [

  "Andhra Pradesh",
  "Arunachal Pradesh",
  "Assam",
  "Bihar",
  "Chhattisgarh",
  "Goa",
  "Gujarat",
  "Haryana",
  "Himachal Pradesh",
  "Jharkhand",
  "Karnataka",
  "Kerala",
  "Madhya Pradesh",
  "Maharashtra",
  "Manipur",
  "Meghalaya",
  "Mizoram",
  "Nagaland",
  "Odisha",
  "Punjab",
  "Rajasthan",
  "Sikkim",
  "Tamil Nadu",
  "Telangana",
  "Tripura",
  "Uttar Pradesh",
  "Uttarakhand",
  "West Bengal",

  "Andaman and Nicobar Islands",
  "Chandigarh",
  "Dadra and Nagar Haveli and Daman and Diu",
  "Delhi",
  "Jammu and Kashmir",
  "Ladakh",
  "Lakshadweep",
  "Puducherry"

];


const ALIASES = {

  "orissa":
    "Odisha",

  "uttaranchal":
    "Uttarakhand",

  "telengana":
    "Telangana",

  "pondicherry":
    "Puducherry",

  "nctofdelhi":
    "Delhi",

  "jammukashmir":
    "Jammu and Kashmir",

  "andamanandnicobar":
    "Andaman and Nicobar Islands",

  "andamannicobarislands":
    "Andaman and Nicobar Islands",

  "dadraandnagarhaveli":
    "Dadra and Nagar Haveli and Daman and Diu",

  "damananddiu":
    "Dadra and Nagar Haveli and Daman and Diu"

};


const normKey = value => {

  return String(value)
    .toLowerCase()
    .replace(/&/g, "and")
    .replace(/[^a-z0-9]/g, "");

};


const CANONICAL_BY_NORM =
  Object.fromEntries(

    CANONICAL_STATES.map(
      state => [
        normKey(state),
        state
      ]
    )

  );


function canonicalState(value) {

  if (!value) {
    return null;
  }

  const key =
    normKey(value);

  return (
    CANONICAL_BY_NORM[key] ||
    ALIASES[key] ||
    null
  );

}


/* =========================================================
   PROPERTY HELPERS
========================================================= */

const STATE_KEYS = [

  "STATE",
  "ST_NM",
  "STATE_NAME",
  "NAME_1",
  "state",
  "st_nm",
  "State",
  "stname",
  "STNAME",
  "STATE_UT"

];


const DISTRICT_KEYS = [

  "DISTRICT",
  "DT_NAME",
  "DIST_NAME",
  "NAME_2",
  "district",
  "dtname",
  "DTNAME",
  "District",
  "dist_name",
  "NAME"

];


function pickProperty(
  properties,
  candidates
) {

  if (!properties) {
    return null;
  }

  for (const candidate of candidates) {

    if (
      properties[candidate] !== undefined &&
      properties[candidate] !== null &&
      properties[candidate] !== ""
    ) {

      return candidate;

    }

  }

  /*
     Case-insensitive fallback.
  */

  const actualKeys =
    Object.keys(properties);

  for (const candidate of candidates) {

    const found =
      actualKeys.find(
        key =>
          key.toLowerCase() ===
          candidate.toLowerCase()
      );

    if (found) {
      return found;
    }

  }

  return null;

}


/* =========================================================
   GENERAL HELPERS
========================================================= */

function slugify(value) {

  return String(value)
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-|-$/g, "");

}


function titleCase(value) {

  return String(value)
    .trim()
    .toLowerCase()
    .replace(
      /(^|[\s(/-])([a-z])/g,
      (match, a, b) =>
        a + b.toUpperCase()
    );

}


/* =========================================================
   GEOMETRY
========================================================= */

function polygonsOf(geometry) {

  if (!geometry) {
    return [];
  }

  if (geometry.type === "Polygon") {

    return [
      geometry.coordinates
    ];

  }

  if (geometry.type === "MultiPolygon") {

    return geometry.coordinates;

  }

  return [];

}


/* =========================================================
   SIMPLIFICATION
========================================================= */

function perpDist(p, a, b) {

  const dx =
    b[0] - a[0];

  const dy =
    b[1] - a[1];

  if (
    dx === 0 &&
    dy === 0
  ) {

    return Math.hypot(
      p[0] - a[0],
      p[1] - a[1]
    );

  }

  const t =
    Math.max(
      0,
      Math.min(
        1,
        (
          (p[0] - a[0]) * dx +
          (p[1] - a[1]) * dy
        ) /
        (dx * dx + dy * dy)
      )
    );

  return Math.hypot(

    p[0] -
      (a[0] + t * dx),

    p[1] -
      (a[1] + t * dy)

  );

}


function simplifyRing(
  points,
  tolerance
) {

  const n =
    points.length;

  if (
    n <= 4 ||
    tolerance <= 0
  ) {

    return points;

  }

  const keep =
    new Uint8Array(n);

  keep[0] = 1;
  keep[n - 1] = 1;

  const stack = [
    [0, n - 1]
  ];

  while (stack.length) {

    const [start, end] =
      stack.pop();

    let maxDistance = 0;
    let index = -1;

    for (
      let i = start + 1;
      i < end;
      i++
    ) {

      const distance =
        perpDist(
          points[i],
          points[start],
          points[end]
        );

      if (
        distance >
        maxDistance
      ) {

        maxDistance =
          distance;

        index = i;

      }

    }

    if (
      index !== -1 &&
      maxDistance > tolerance
    ) {

      keep[index] = 1;

      stack.push(
        [start, index],
        [index, end]
      );

    }

  }

  const output =
    points.filter(
      (_, index) =>
        keep[index]
    );

  return output.length >= 4
    ? output
    : points;

}


function cleanPolygons(
  geometry,
  tolerance
) {

  const result = [];

  for (
    const polygon
    of polygonsOf(geometry)
  ) {

    const rings = [];

    for (
      let i = 0;
      i < polygon.length;
      i++
    ) {

      const points =
        polygon[i].map(
          coordinate => [

            Math.round(
              coordinate[0] * 1e4
            ) / 1e4,

            Math.round(
              coordinate[1] * 1e4
            ) / 1e4

          ]
        );

      const simplified =
        simplifyRing(
          points,
          tolerance
        );

      if (
        simplified.length >= 4
      ) {

        rings.push(
          simplified
        );

      } else if (
        i === 0
      ) {

        break;

      }

    }

    if (rings.length) {
      result.push(rings);
    }

  }

  return result;

}


function toGeometry(polygons) {

  if (
    polygons.length === 1
  ) {

    return {
      type: "Polygon",
      coordinates: polygons[0]
    };

  }

  return {
    type: "MultiPolygon",
    coordinates: polygons
  };

}

/* =========================================================
   FETCH HELPERS
========================================================= */

async function fetchFromBases(
  bases,
  path
) {

  let lastError =
    null;

  for (
    const base
    of bases
  ) {

    try {

      const response =
        await fetch(
          base + path
        );

      if (!response.ok) {

        throw new Error(
          "HTTP " +
          response.status
        );

      }

      return await response.json();

    } catch (error) {

      console.warn(
        "Could not load:",
        base + path,
        error
      );

      lastError =
        error;

    }

  }

  throw new Error(
    "Unable to download map data. " +
    (
      lastError
        ? lastError.message
        : ""
    )
  );

}


/* =========================================================
   INDIA MAP LOADING
========================================================= */

let indiaPromise = null;


async function loadIndiaData() {

  if (!indiaPromise) {

    indiaPromise =
      (async () => {

        const geojson =
          await fetchFromBases(
            INDIA_BASES,
            INDIA_FILE
          );

        const grouped =
          new Map();

        for (
          const feature
          of geojson.features
        ) {

          const properties =
            feature.properties || {};

          const stateKey =
            pickProperty(
              properties,
              STATE_KEYS
            );

          if (!stateKey) {

            throw new Error(
              "No state-name property found."
            );

          }

          const state =
            canonicalState(
              properties[stateKey]
            );

          if (!state) {

            console.warn(
              "Unknown state:",
              properties[stateKey]
            );

            continue;

          }

          if (
            !grouped.has(state)
          ) {

            grouped.set(
              state,
              []
            );

          }

          grouped
            .get(state)
            .push(
              ...cleanPolygons(
                feature.geometry,
                0.004
              )
            );

        }


        const features = [];


        for (
          const state
          of CANONICAL_STATES
        ) {

          const polygons =
            grouped.get(state);

          if (
            !polygons ||
            !polygons.length
          ) {

            console.warn(
              "No geometry for:",
              state
            );

            continue;

          }

          features.push({

            type: "Feature",

            properties: {

              id:
                slugify(state),

              name:
                state

            },

            geometry:
              toGeometry(polygons)

          });

        }


        return {

          type:
            "FeatureCollection",

          features

        };

      })()
      .catch(error => {

        indiaPromise = null;

        throw error;

      });

  }

  return indiaPromise;

}


/* =========================================================
   INDIA STATE DISTRICT LOADER
========================================================= */

const stateCache =
  new Map();


async function loadStateDistricts(
  stateName
) {

  const canonical =
    canonicalState(
      stateName
    ) || stateName;

  if (
    stateCache.has(canonical)
  ) {

    return stateCache.get(
      canonical
    );

  }


  const folder =
    STATE_FOLDER[canonical];

  if (!folder) {

    throw new Error(
      "No district dataset configured for " +
      canonical
    );

  }


  let fileName =
    STATE_FILE_NAME[canonical];


  if (!fileName) {

    fileName =
      folder +
      "_DISTRICTS.geojson";

  }


  const path =
    encodeURIComponent(folder) +
    "/" +
    encodeURIComponent(fileName);


  const geojson =
    await fetchFromBases(
      STATE_BASES,
      path
    );


  const features = [];


  for (
    const feature
    of geojson.features
  ) {

    const properties =
      feature.properties || {};

    const districtKey =
      pickProperty(
        properties,
        DISTRICT_KEYS
      );

    if (!districtKey) {
      continue;
    }

    const districtName =
      titleCase(
        properties[districtKey]
      );

    const polygons =
      cleanPolygons(
        feature.geometry,
        0.0015
      );

    if (!polygons.length) {
      continue;
    }

    features.push({

      type:
        "Feature",

      properties: {

        id:
          slugify(
            canonical +
            "-" +
            districtName
          ),

        name:
          districtName

      },

      geometry:
        toGeometry(polygons)

    });

  }


  if (!features.length) {

    throw new Error(
      "No districts found for " +
      canonical
    );

  }


  const result = {

    type:
      "FeatureCollection",

    features

  };


  stateCache.set(
    canonical,
    result
  );


  return result;

}


/* =========================================================
   WORLD COUNTRIES
========================================================= */

let worldPromise = null;


async function loadWorldCountries() {

  if (!worldPromise) {

    worldPromise =
      fetch(
        WORLD_COUNTRIES_URL
      )
      .then(response => {

        if (!response.ok) {

          throw new Error(
            "HTTP " +
            response.status
          );

        }

        return response.json();

      })
      .then(geojson => {

        const features = [];


        for (
          const feature
          of geojson.features
        ) {

          const properties =
            feature.properties || {};


          /*
             Natural Earth uses
             several possible ISO/name
             properties depending on
             the version.
          */

          const name =
            properties.NAME ||
            properties.ADMIN ||
            properties.name ||
            properties.NAME_LONG;


          const iso =
            properties.ADM0_A3 ||
            properties.ISO_A3 ||
            properties.iso_a3 ||
            properties["ISO3166-1-Alpha-3"];


          if (!name) {
            continue;
          }


          /*
             Remove Antarctica from the
             clickable country list because
             it is not a normal country
             with ADM1 states/provinces.
          */

          if (
            String(name)
              .toLowerCase() ===
            "antarctica"
          ) {

            continue;

          }


          const polygons =
            cleanPolygons(
              feature.geometry,
              0.02
            );


          if (!polygons.length) {
            continue;
          }


          features.push({

            type:
              "Feature",

            properties: {

              id:
                iso ||
                slugify(name),

              name:
                name,

              iso:
                iso || ""

            },

            geometry:
              toGeometry(polygons)

          });

        }


        return {

          type:
            "FeatureCollection",

          features

        };

      })
      .catch(error => {

        worldPromise = null;

        throw error;

      });

  }

  return worldPromise;

}


/* =========================================================
   COUNTRY ADM1 DATA
========================================================= */

const countryADM1Cache =
  new Map();


async function loadCountryADM1(
  country
) {

  const iso =
    String(
      country.iso || ""
    ).toUpperCase();


  if (!iso) {

    throw new Error(
      "No ISO code found for " +
      country.name
    );

  }


  if (
    countryADM1Cache.has(iso)
  ) {

    return countryADM1Cache.get(
      iso
    );

  }


  /*
     Ask geoBoundaries for
     the country's ADM1 layer.
  */

  const metadataURL =
    GEOboundariesAPI +
    "/" +
    encodeURIComponent(iso) +
    "/ADM1/";


  const metadataResponse =
    await fetch(
      metadataURL
    );


  if (
    !metadataResponse.ok
  ) {

    throw new Error(
      "ADM1 API HTTP " +
      metadataResponse.status
    );

  }


  const metadata =
    await metadataResponse.json();


  /*
     The API normally returns an
     object containing boundary
     metadata.

     This helper makes the code
     tolerant of array/object
     response formats.
  */

  let boundary =
    metadata;


  if (
    Array.isArray(metadata)
  ) {

    boundary =
      metadata[0];

  }


  if (
    !boundary ||
    typeof boundary !== "object"
  ) {

    throw new Error(
      "No ADM1 information found for " +
      country.name
    );

  }


  /*
     Some API responses can contain
     the boundary information nested
     inside an array/object.
  */

  if (
    Array.isArray(
      boundary.boundaries
    )
  ) {

    boundary =
      boundary.boundaries[0];

  }


  const geoJSONURL =
    boundary.simplifiedGeometryGeoJSON ||
    boundary.gjDownloadURL ||
    boundary.geoJSON;


  if (!geoJSONURL) {

    throw new Error(
      "No ADM1 GeoJSON URL returned for " +
      country.name
    );

  }


  const geoResponse =
    await fetch(
      geoJSONURL
    );


  if (
    !geoResponse.ok
  ) {

    throw new Error(
      "ADM1 GeoJSON HTTP " +
      geoResponse.status
    );

  }


  const geojson =
    await geoResponse.json();


  const features = [];


  for (
    const feature
    of geojson.features || []
  ) {

    const properties =
      feature.properties || {};


    /*
       geoBoundaries property
       names can vary.

       Try the common possibilities.
    */

    const nameKey =
      pickProperty(
        properties,
        [

          "shapeName",
          "NAME_1",
          "NAME",
          "name",
          "Name",
          "NAME_0",
          "boundaryName"

        ]
      );


    const divisionName =
      nameKey
        ? properties[nameKey]
        : "Unknown";


    const polygons =
      cleanPolygons(
        feature.geometry,
        0.003
      );


    if (!polygons.length) {
      continue;
    }


    features.push({

      type:
        "Feature",

      properties: {

        id:
          slugify(
            country.name +
            "-" +
            divisionName
          ),

        name:
          titleCase(
            divisionName
          )

      },

      geometry:
        toGeometry(polygons)

    });

  }


  if (!features.length) {

    throw new Error(
      "No first-level divisions found for " +
      country.name
    );

  }


  const result = {

    type:
      "FeatureCollection",

    features

  };


  countryADM1Cache.set(
    iso,
    result
  );


  return result;

}


/* =========================================================
   PROJECTION
========================================================= */

function project(
  longitude,
  latitude
) {

  const radians =
    Math.PI / 180;

  const clampedLatitude =
    Math.max(
      -85,
      Math.min(
        85,
        latitude
      )
    );


  return [

    longitude * radians,

    -Math.log(
      Math.tan(
        Math.PI / 4 +
        (
          clampedLatitude *
          radians
        ) / 2
      )
    )

  ];

}


/* =========================================================
   BOUNDS
========================================================= */

function computeBounds(
  features
) {

  let minX =
    Infinity;

  let minY =
    Infinity;

  let maxX =
    -Infinity;

  let maxY =
    -Infinity;


  for (
    const feature
    of features
  ) {

    for (
      const polygon
      of polygonsOf(
        feature.geometry
      )
    ) {

      for (
        const ring
        of polygon
      ) {

        for (
          const coordinate
          of ring
        ) {

          const [
            x,
            y
          ] =
            project(
              coordinate[0],
              coordinate[1]
            );


          if (x < minX)
            minX = x;

          if (x > maxX)
            maxX = x;

          if (y < minY)
            minY = y;

          if (y > maxY)
            maxY = y;

        }

      }

    }

  }


  return {

    minX,
    minY,
    maxX,
    maxY

  };

}


/* =========================================================
   SVG PATH
========================================================= */

function buildPathData(
  geometry,
  transform
) {

  const parts = [];


  for (
    const polygon
    of polygonsOf(geometry)
  ) {

    for (
      const ring
      of polygon
    ) {

      let d = "";

      let lastX = null;
      let lastY = null;


      for (
        let i = 0;
        i < ring.length;
        i++
      ) {

        const [
          x,
          y
        ] =
          transform(
            ring[i][0],
            ring[i][1]
          );


        /*
           Avoid generating excessive
           duplicate SVG coordinates.
        */

        if (
          lastX !== null &&
          Math.abs(
            x - lastX
          ) < 0.15 &&
          Math.abs(
            y - lastY
          ) < 0.15
        ) {

          continue;

        }


        d +=
          (
            d
              ? "L"
              : "M"
          ) +
          x.toFixed(2) +
          " " +
          y.toFixed(2);


        lastX = x;
        lastY = y;

      }


      if (d) {

        parts.push(
          d + "Z"
        );

      }

    }

  }


  return parts.join("");

}


/* =========================================================
   RENDER MAP
========================================================= */

function renderMap(
  geojson,
  level
) {

  const features =
    geojson.features.filter(
      feature =>
        polygonsOf(
          feature.geometry
        ).length
    );


  if (!features.length) {

    throw new Error(
      "No map geometry available."
    );

  }


  const bounds =
    computeBounds(
      features
    );


  const mapWidth =
    bounds.maxX -
    bounds.minX;


  const mapHeight =
    bounds.maxY -
    bounds.minY;


  /*
     Give the map a sensible
     maximum drawing width.
  */

  const targetWidth =
    level === "world"
      ? 1200
      : 1000;


  const scale =
    targetWidth /
    mapWidth;


  const transform =
    (longitude, latitude) => {

      const [
        x,
        y
      ] =
        project(
          longitude,
          latitude
        );


      return [

        (
          x -
          bounds.minX
        ) * scale,

        (
          y -
          bounds.minY
        ) * scale

      ];

    };


  const width =
    mapWidth * scale;


  const height =
    mapHeight * scale;


  const padding = 15;


  const SVG_NS =
    "http://www.w3.org/2000/svg";


  const svg =
    document.createElementNS(
      SVG_NS,
      "svg"
    );


  svg.setAttribute(
    "viewBox",
    `${-padding} ${-padding} ${
      width + padding * 2
    } ${
      height + padding * 2
    }`
  );


  svg.setAttribute(
    "preserveAspectRatio",
    "xMidYMid meet"
  );


  svg.setAttribute(
    "role",
    "img"
  );


  let ariaLabel =
    "Map";


  if (level === "india") {

    ariaLabel =
      "Map of India";

  }

  else if (
    level === "state"
  ) {

    ariaLabel =
      "District map";

  }

  else if (
    level === "world"
  ) {

    ariaLabel =
      "World map";

  }

  else if (
    level === "country"
  ) {

    ariaLabel =
      "Country administrative map";

  }


  svg.setAttribute(
    "aria-label",
    ariaLabel
  );


  for (
    const feature
    of features
  ) {

    const path =
      document.createElementNS(
        SVG_NS,
        "path"
      );


    path.setAttribute(
      "d",
      buildPathData(
        feature.geometry,
        transform
      )
    );


    path.setAttribute(
      "class",
      "region"
    );


    path.setAttribute(
      "fill-rule",
      "evenodd"
    );


    path.dataset.id =
      feature.properties.id ||
      "";


    path.dataset.name =
      feature.properties.name ||
      "";


    /*
       ISO is only needed by
       the World Map.
    */

    if (
      feature.properties.iso
    ) {

      path.dataset.iso =
        feature.properties.iso;

    }


    svg.appendChild(
      path
    );

  }


  root.className =
    "level-" +
    level;


  root.innerHTML =
    "";


  root.appendChild(
    svg
  );


  return svg;

}


/* =========================================================
   TOOLTIP
========================================================= */

function showTooltip(
  text,
  clientX,
  clientY
) {

  tooltip.textContent =
    text;


  tooltip.hidden =
    false;


  const margin =
    14;


  const width =
    tooltip.offsetWidth;


  const height =
    tooltip.offsetHeight;


  let x =
    clientX + margin;


  let y =
    clientY + margin;


  if (
    x + width >
    window.innerWidth - 4
  ) {

    x =
      clientX -
      width -
      margin;

  }


  if (
    y + height >
    window.innerHeight - 4
  ) {

    y =
      clientY -
      height -
      margin;

  }


  tooltip.style.transform =
    `translate(${
      Math.max(4, x)
    }px, ${
      Math.max(4, y)
    }px)`;

}


function hideTooltip() {

  tooltip.hidden =
    true;

}


/* =========================================================
   EVENT HELPERS
========================================================= */

function regionFromEvent(e) {

  return e.target instanceof Element
    ? e.target.closest(
        "path.region"
      )
    : null;

}


/* =========================================================
   HOVER
========================================================= */

function setupHover(
  svg
) {

  svg.addEventListener(
    "pointerover",
    e => {

      const region =
        regionFromEvent(e);

      if (region) {

        showTooltip(

          region.dataset.name,

          e.clientX,

          e.clientY

        );

      }

    }
  );


  svg.addEventListener(
    "pointermove",
    e => {

      const region =
        regionFromEvent(e);

      if (region) {

        showTooltip(

          region.dataset.name,

          e.clientX,

          e.clientY

        );

      } else {

        hideTooltip();

      }

    }
  );


  svg.addEventListener(
    "pointerleave",
    hideTooltip
  );


  svg.addEventListener(
    "pointerdown",
    e => {

      const region =
        regionFromEvent(e);

      if (region) {

        showTooltip(

          region.dataset.name,

          e.clientX,

          e.clientY

        );

      }

    }
  );

}


/* =========================================================
   INDIA STATE CLICK
========================================================= */

function setupIndiaClick(
  svg
) {

  svg.addEventListener(
    "click",
    e => {

      const region =
        regionFromEvent(e);

      if (!region) {
        return;
      }


      loadStateMap({

        name:
          region.dataset.name

      });

    }
  );

}


/* =========================================================
   WORLD COUNTRY CLICK
========================================================= */

function setupWorldClick(
  svg
) {

  svg.addEventListener(
    "click",
    e => {

      const region =
        regionFromEvent(e);

      if (!region) {
        return;
      }


      loadCountryMap({

        name:
          region.dataset.name,

        iso:
          region.dataset.iso

      });

    }
  );

}


/* =========================================================
   INDIA MAP
========================================================= */

async function loadIndiaMap() {

  hideTooltip();


  /*
     India is the main starting
     screen.

     World button is visible.
     Back button is hidden.
  */

  backBtn.hidden =
    true;

  worldBtn.hidden =
    false;


  worldBtn.textContent =
    "🌍 World";


  titleEl.textContent =
    "India Map";


  subtitleEl.textContent =
    "Interactive Map";


  try {

    showStatus(
      "Loading India map…"
    );


    const data =
      await loadIndiaData();


    const svg =
      renderMap(
        data,
        "india"
      );


    setupHover(
      svg
    );


    setupIndiaClick(
      svg
    );

  }

  catch (error) {

    showError(
      error,
      loadIndiaMap
    );

  }

}


/* =========================================================
   INDIA STATE MAP
========================================================= */

async function loadStateMap(
  state
) {

  hideTooltip();


  /*
     Back to India.
  */

  backBtn.hidden =
    false;


  backBtn.textContent =
    "← India";


  /*
     World button remains
     available.
  */

  worldBtn.hidden =
    false;


  worldBtn.textContent =
    "🌍 World";


  titleEl.textContent =
    state.name;


  subtitleEl.textContent =
    "Districts";


  try {

    showStatus(
      "Loading district map…"
    );


    const data =
      await loadStateDistricts(
        state.name
      );


    const svg =
      renderMap(
        data,
        "state"
      );


    /*
       IMPORTANT:

       Districts have hover
       only.

       There is NO click
       handler here.
    */

    setupHover(
      svg
    );

  }

  catch (error) {

    showError(
      error,
      () =>
        loadStateMap(
          state
        )
    );

  }

}


/* =========================================================
   WORLD MAP
========================================================= */

async function loadWorldMap() {

  hideTooltip();


  /*
     Back button goes to India.
  */

  backBtn.hidden =
    false;


  backBtn.textContent =
    "← India";


  /*
     Change button to indicate
     the current World screen.

     Clicking it while already on
     World simply keeps World open.
  */

  worldBtn.hidden =
    true;


  titleEl.textContent =
    "World Map";


  subtitleEl.textContent =
    "Interactive Map";


  try {

    showStatus(
      "Loading world map…"
    );


    const data =
      await loadWorldCountries();


    const svg =
      renderMap(
        data,
        "world"
      );


    setupHover(
      svg
    );


    setupWorldClick(
      svg
    );

  }

  catch (error) {

    showError(
      error,
      loadWorldMap
    );

  }

}


/* =========================================================
   COUNTRY MAP
========================================================= */

async function loadCountryMap(
  country
) {

  hideTooltip();


  /*
     Back goes to World.
  */

  backBtn.hidden =
    false;


  backBtn.textContent =
    "← World";


  worldBtn.hidden =
    true;


  titleEl.textContent =
    country.name;


  subtitleEl.textContent =
    "States / Provinces / Regions";


  try {

    showStatus(
      "Loading " +
      country.name +
      " administrative map…"
    );


    const data =
      await loadCountryADM1(
        country
      );


    const svg =
      renderMap(
        data,
        "country"
      );


    /*
       IMPORTANT:

       ADM1 regions only hover.

       They cannot be clicked.
    */

    setupHover(
      svg
    );

  }

  catch (error) {

    showError(

      error,

      () =>
        loadCountryMap(
          country
        )

    );

  }

}


/* =========================================================
   NAVIGATION
========================================================= */


/*
   World button from India
   or India state screen.
*/

worldBtn.addEventListener(
  "click",
  () => {

    loadWorldMap();

  }
);


/*
   Back button:

   India state -> India
   World -> India
   Country -> World
*/

backBtn.addEventListener(
  "click",
  () => {

    /*
       If the current title is
       World Map, go to India.

       If current subtitle is
       States / Provinces / Regions,
       go back to World.
    */

    if (
      subtitleEl.textContent ===
      "States / Provinces / Regions"
    ) {

      loadWorldMap();

      return;

    }


    loadIndiaMap();

  }
);


/*
   ESC navigation.
*/

document.addEventListener(
  "keydown",
  e => {

    if (
      e.key !== "Escape"
    ) {

      return;

    }


    if (
      subtitleEl.textContent ===
      "States / Provinces / Regions"
    ) {

      loadWorldMap();

    }

    else if (
      titleEl.textContent ===
      "World Map"
    ) {

      loadIndiaMap();

    }

    else if (
      !backBtn.hidden
    ) {

      loadIndiaMap();

    }

  }
);


/* =========================================================
   START APPLICATION
========================================================= */

loadIndiaMap();

</script>
